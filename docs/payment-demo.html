<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الدفع | Skyline</title>
  <link rel="icon" href="assets/logo.svg" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body style="background:var(--navy-grad);min-height:100vh;display:grid;place-items:center;padding:20px">
  <div class="form-card" style="max-width:440px;width:100%">
    <div style="text-align:center;margin-bottom:18px">
      <img src="assets/logo.svg" alt="Skyline" style="width:64px;margin:0 auto 10px" />
      <span class="chip gold">🧩 وضع محاكاة الدفع (Stripe غير مُفعّل)</span>
    </div>
    <h3 style="color:#fff;text-align:center" id="title">إتمام الدفع</h3>
    <p style="text-align:center;color:var(--muted);margin:6px 0 20px">المبلغ المستحق: <strong id="amount" style="color:var(--gold-300);font-size:1.3rem"></strong></p>

    <div class="alert" id="alert"></div>

    <!-- Mock card form (visual only — demo mode) -->
    <div class="field"><label>رقم البطاقة</label><input value="4242 4242 4242 4242" /></div>
    <div style="display:flex;gap:12px">
      <div class="field" style="flex:1"><label>تاريخ الانتهاء</label><input value="12 / 28" /></div>
      <div class="field" style="flex:1"><label>CVC</label><input value="123" /></div>
    </div>
    <button class="btn btn-gold btn-block" id="payBtn">تأكيد الدفع 🔒</button>
    <p style="text-align:center;color:var(--muted);font-size:.8rem;margin-top:14px">
      هذه محاكاة آمنة لعرض تدفّق الدفع. أضف مفاتيح Stripe لتفعيل المدفوعات الحقيقية.
    </p>
    <a href="services.html" style="display:block;text-align:center;margin-top:10px;color:var(--muted)">إلغاء والعودة</a>
  </div>

  <script src="js/app.js"></script>
  <script>
    const p = new URLSearchParams(location.search);
    const pid = p.get('pid');
    el('#title').textContent = p.get('title') || 'إتمام الدفع';
    el('#amount').textContent = money(+p.get('amount'), p.get('currency') || 'usd');

    el('#payBtn').onclick = async () => {
      const btn = el('#payBtn'); btn.disabled = true; btn.textContent = 'جارٍ المعالجة…';
      try {
        const r = await api('/payments/demo/confirm', { method: 'POST', body: JSON.stringify({ payment_id: pid }) });
        location.href = `/payment-success.html?demo=1&ref=${r.reference}`;
      } catch (err) {
        showAlert(el('#alert'), err.message);
        btn.disabled = false; btn.textContent = 'تأكيد الدفع 🔒';
      }
    };
  </script>
</body>
</html>
